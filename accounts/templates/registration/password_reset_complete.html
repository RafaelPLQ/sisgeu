{% extends 'base.html' %}

{% block login %}
<div id="page-login" class="show">
  <div class="login-box">
    <div class="login-logo">✅</div>
    <div class="login-title">Senha Alterada!</div>
    <div class="login-sub">Sua senha foi redefinida com sucesso. Faça login para continuar.</div>

    <a href="{% url 'accounts:login' %}" class="login-btn"
       style="display: block; text-align: center; text-decoration: none; margin-top: 8px;">
      Fazer login →
    </a>
  </div>
</div>
{% endblock %}
