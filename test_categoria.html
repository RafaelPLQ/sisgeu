<!DOCTYPE html>
<html>
<head>
    <title>Teste Categoria</title>
    <meta name="csrf-token" content="test-csrf-token">
</head>
<body>
    <h1>Teste de Adição de Categoria</h1>

    <div>
        <label>Nome:</label>
        <input id="input-category-name" type="text" value="Teste Categoria">
    </div>

    <div>
        <label>Ícone:</label>
        <select id="input-category-icon">
            <option value="🎯">🎯 Genérico</option>
            <option value="💰">💰 Dinheiro</option>
        </select>
    </div>

    <button id="btn-save-category">Criar Categoria</button>

    <script>
        // Simular as funções globais
        function openModal(id) {
            console.log('Abrindo modal:', id);
        }

        function closeModal(id) {
            console.log('Fechando modal:', id);
        }

        // Aguardar o DOM carregar completamente
        document.addEventListener('DOMContentLoaded', function() {
            // Event listener para o botão salvar categoria
            const saveButton = document.getElementById('btn-save-category');
            if (saveButton) {
                saveButton.addEventListener('click', saveCategory);
                console.log('Event listener adicionado ao botão salvar categoria');
            } else {
                console.error('Botão salvar categoria não encontrado');
            }
        });

        // Envio do formulário de adicionar categoria
        async function saveCategory() {
            console.log('Função saveCategory chamada');

            const name = document.getElementById('input-category-name').value.trim();
            const icon = document.getElementById('input-category-icon').value || '🎯';

            console.log('Nome:', name);
            console.log('Ícone:', icon);

            if (!name) {
                alert('Por favor, preencha o nome da categoria');
                return;
            }

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                console.log('CSRF Token encontrado:', csrfToken);

                const formData = new FormData();
                formData.append('name', name);
                formData.append('icon', icon);
                formData.append('csrfmiddlewaretoken', csrfToken);

                console.log('Dados do FormData:');
                for (let [key, value] of formData.entries()) {
                    console.log(key, ':', value);
                }

                console.log('Enviando requisição para: /orcamento/add-category/');

                const response = await fetch('/orcamento/add-category/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': csrfToken,
                    },
                });

                console.log('Status da resposta:', response.status);

                const data = await response.json();
                console.log('Dados da resposta:', data);

                if (data.success) {
                    console.log('Sucesso! Recarregando página...');
                    closeModal('modal-add-category');
                    document.getElementById('input-category-name').value = '';
                    document.getElementById('input-category-icon').value = '🎯';
                    alert('Categoria criada com sucesso!');
                } else {
                    const errorMsg = data.errors?.name?.[0] || data.errors?.icon?.[0] || 'Erro desconhecido';
                    alert('Erro ao adicionar categoria: ' + errorMsg);
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Erro na comunicação com o servidor');
            }
        }
    </script>
</body>
</html>
