{% extends 'base.html' %}

{% block login %}
<div id="page-login" class="show">
  <div class="login-box">
    <div class="login-logo">📧</div>
    <div class="login-title">E-mail Enviado</div>
    <div class="login-sub">
      Enviamos as instruções para o seu e-mail. Verifique também a pasta de spam.
    </div>

    <a href="{% url 'accounts:login' %}" class="login-btn"
       style="display: block; text-align: center; text-decoration: none; margin-top: 8px;">
      ← Voltar ao login
    </a>
  </div>
</div>
{% endblock %}
